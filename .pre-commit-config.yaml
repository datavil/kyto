# Lint and format hooks. Run with `uv run pre-commit run --all-files`.
# Every hook is local and runs through `uv run`, so the tools and versions come from
# uv.lock (one build path, memory/build_single_path.md). `uv run` also puts
# .venv/bin first on PATH, so cargo's PyO3 build sees the project interpreter.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: uv run cargo clippy --workspace --all-targets --locked -- -D warnings
        language: system
        types_or: [rust, toml]
        pass_filenames: false
      # ruff check runs first: its fixes can change line lengths that format then wraps.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: pyright
        name: pyright --strict
        entry: uv run pyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false
