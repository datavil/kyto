[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "kyto"
description = "Lazy, streaming single-cell analysis, written in Rust, used from Python."
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]
# The version comes from the workspace Cargo.toml (single source).
dynamic = ["version"]

[dependency-groups]
dev = [
    "maturin>=1.9.4,<2",
    "pre-commit>=4.6.2",
    "pyright[nodejs]>=1.1.414",
    "pytest>=8",
    "ruff>=0.17.4",
]

[tool.maturin]
manifest-path = "crates/kyto-py/Cargo.toml"
python-source = "python"
module-name = "kyto._kyto"
features = ["extension-module"]

[tool.uv]
# Rebuild the extension whenever Rust sources or manifests change (memory/build_single_path.md).
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# Defaults (E4, E7, E9, F) plus import sorting (I), pyupgrade (UP), bugbear (B).
extend-select = ["I", "UP", "B"]

[tool.pyright]
# Strict on every Python file in the repo (.pyi stubs included); pyright skips
# dot-directories such as .venv by default.
typeCheckingMode = "strict"
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
