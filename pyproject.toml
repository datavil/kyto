[build-system]
# cmake builds the static HDF5 bundled by hdf5-metno (task 2.6) in the isolated build env.
requires = ["maturin>=1.9.4,<2", "cmake>=3.31"]
build-backend = "maturin"

[project]
name = "kyto"
description = "Lazy, streaming single-cell analysis, written in Rust, used from Python."
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]
# The version comes from the workspace Cargo.toml (single source).
dynamic = ["version"]

[project.optional-dependencies]
# Plotting (task 7.8): kyto draws no plots; `Atlas.to_anndata` hands results to
# cellestial (decided by the user, Nov 13, 2026). Not needed by anything else in kyto.
plot = [
    "anndata>=0.12.19; python_version >= '3.11'",
    "cellestial>=0.62.1; python_version >= '3.11'",
]

[dependency-groups]
dev = [
    # Builds the bundled static HDF5 (hdf5-metno `static`, task 2.6) for `uv run cargo`.
    "cmake>=3.31",
    "maturin>=1.9.4,<2",
    "numpy>=2.2",
    # Reads kyto tables in tests (Parquet written by the Rust polars crate, task 2.3).
    "polars>=1.34",
    "pre-commit>=4.6.2",
    "pyright[nodejs]>=1.1.414",
    "pytest>=8",
    "ruff>=0.17.4",
    # Types the handle terminals that return SciPy matrices in the stubs (task 3.6).
    "scipy>=1.15",
    # Reference implementations for parity (task 1.5), pinned in uv.lock. Only on
    # Python >= 3.12 (scanpy 1.12) and not on Windows ARM64 or macOS x86_64: numcodecs,
    # numba, llvmlite or scikit-misc have no wheels there. Parity tests skip without
    # scanpy; building the fixtures needs only numpy.
    "anndata>=0.12.19; python_version >= '3.12' and (sys_platform != 'win32' or platform_machine != 'ARM64') and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
    "scanpy>=1.12.5; python_version >= '3.12' and (sys_platform != 'win32' or platform_machine != 'ARM64') and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
    "scikit-misc>=0.5; python_version >= '3.12' and (sys_platform != 'win32' or platform_machine != 'ARM64') and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
    # Leiden and Louvain references (task 6.8): scanpy's tl.leiden runs leidenalg; the
    # `louvain` package scanpy's tl.louvain uses has no Python 3.13 build, so its
    # reference runs leidenalg's optimiser without refinement (Louvain).
    "leidenalg>=0.10; python_version >= '3.12' and (sys_platform != 'win32' or platform_machine != 'ARM64') and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
    # Scrublet reference (task 6.12): scanpy's pp.scrublet finds its automatic
    # threshold with scikit-image's threshold_minimum.
    "scikit-image>=0.25; python_version >= '3.12' and (sys_platform != 'win32' or platform_machine != 'ARM64') and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
    # Plotting examples of docs/plotting.md (task 7.8), run as tests.
    "cellestial>=0.62.1; python_version >= '3.12' and (sys_platform != 'win32' or platform_machine != 'ARM64') and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
]

[tool.maturin]
manifest-path = "crates/kyto-py/Cargo.toml"
python-source = "python"
module-name = "kyto._kyto"
features = ["extension-module"]

[tool.uv]
# cellestial 0.62.1 caps polars < 2 and pandas < 3; the dev env runs polars 2 and pandas 3,
# with which its plots build (task 7.8, checked on cellestial 0.62.1). Lifts the caps for
# the dev env only: users of `kyto[plot]` get cellestial's own pins.
override-dependencies = ["polars[pyarrow]>=1.34", "pandas>=2.2.3"]
# Rebuild the extension whenever Rust sources or manifests change (memory/build_single_path.md).
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test helpers (tests/fixtures) import as `fixtures`.
pythonpath = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# Defaults (E4, E7, E9, F) plus import sorting (I), pyupgrade (UP), bugbear (B).
extend-select = ["I", "UP", "B"]

[tool.pyright]
# Strict on every Python file in the repo (.pyi stubs included); pyright skips
# dot-directories such as .venv by default.
typeCheckingMode = "strict"
# The dev env's version (.python-version). numpy >= 2.3 stubs only type-check on
# Python >= 3.12 (collections.abc.Buffer); ruff's target-version keeps the 3.10 syntax
# floor. Decided by the user in task 1.5.
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
# Test helpers (tests/fixtures) import as `fixtures`.
extraPaths = ["tests"]
