[package]
name = "kyto-store"
description = "Zarr layout, tile I/O and importers for kyto."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kyto-error = { path = "../kyto-error" }
kyto-core = { path = "../kyto-core" }
polars = { version = "0.55.2", default-features = false, features = ["parquet", "dtype-categorical", "dtype-i8", "dtype-i16", "dtype-u8", "dtype-u16"] }
rayon = "1.12.0"
# 64-byte aligned CellBlock buffers without `unsafe` (task 5.1).
bytemuck = { version = "1.25.2", features = ["derive"] }
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
zstd-safe = { version = "7.2.4", default-features = false }
zarrs = { version = "0.22.10", default-features = false, features = ["filesystem", "sharding", "zstd", "crc32c"] }
hdf5-metno = { version = "0.15.1", features = ["static", "zlib", "lzf"] }
flate2 = "1.1.11"
sha2 = "0.11.1"
# Remote stores (task 2.8): the object_store version polars already uses, so one copy.
object_store = { version = "0.13.2", default-features = false, features = ["aws", "gcp", "http"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "net", "time"] }
futures = "0.3.34"
url = "2.5.8"

[dev-dependencies]
# Peak heap of a concat, in its own test binary (tests/concat_memory.rs, task 2.9).
peak_alloc = "0.3.0"
proptest = "1.11.0"
tempfile = "3.27.0"
