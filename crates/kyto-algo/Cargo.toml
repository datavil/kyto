[package]
name = "kyto-algo"
description = "Single-cell algorithms (QC, HVG, PCA, kNN, clustering, DE) for kyto."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kyto-core = { path = "../kyto-core" }
kyto-error = { path = "../kyto-error" }
# The per-cell QC metrics (task 6.1) live in the executor, which computes them (task 5.8).
kyto-exec = { path = "../kyto-exec" }
# The gene table a QC gene set is evaluated on (task 6.1).
kyto-store = { path = "../kyto-store" }
# Differential expression (task 6.10) runs a plan's output through the executor.
kyto-plan = { path = "../kyto-plan" }
# erf, erfc and lgamma for the tests' p-values (task 6.10); the version already locked.
libm = "0.2.16"
# Evaluates a gene-set predicate on the gene table; same version as kyto-core.
polars = { version = "0.55.2", default-features = false, features = ["lazy", "strings", "dtype-categorical"] }

[dev-dependencies]
tempfile = "3.27.0"
serde_json = "1.0.154"
polars = { version = "0.55.2", default-features = false }
