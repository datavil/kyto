[package]
name = "kyto-plan"
description = "Logical plan, optimizer, explain and estimate for kyto."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kyto-core = { path = "../kyto-core" }
kyto-error = { path = "../kyto-error" }
# Node parameters and output schemas derive serde for the plan JSON of task 4.3.
# `column_dtype` asks Polars for the dtype of a computed column (task 4.2); same version
# as kyto-core, which already brings it in.
polars = { version = "0.55.2", default-features = false, features = ["lazy", "dtype-i8", "dtype-i16", "dtype-u8", "dtype-u16"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
# The plan JSON (task 4.3). `float_roundtrip` parses every float back to the same bits,
# so the round trip is exact.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[dev-dependencies]
# The estimate's assumed chunk sizes are checked against the store writer's (tests
# only: the library itself never reads a store, task 4.2). The 4.6 fixture check
# measures the executor in kyto-exec (task 5.5).
kyto-store = { path = "../kyto-store" }
proptest = "1.11.0"
