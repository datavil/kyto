[package]
name = "kyto-exec"
description = "Streaming CPU executor and SIMD kernels for kyto."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kyto-store = { path = "../kyto-store" }
kyto-error = { path = "../kyto-error" }
# The executor runs a physical plan (task 4.5).
kyto-plan = { path = "../kyto-plan" }
# One thread pool per run, of the size asked for (task 5.2, R7); same version as kyto-store.
rayon = "1.12.0"
# Opens the scan's store (filesystem) and names the storage trait the tile reader reads
# through; same version and features as kyto-store.
zarrs = { version = "0.22.10", default-features = false, features = ["filesystem", "sharding", "zstd", "crc32c"] }
# SIMD kernels (task 5.3): runtime dispatch to AVX-512 (`x86-v4`), AVX2 (`x86-v3`, on by
# default) or NEON, with a scalar fallback.
pulp = { version = "0.22.3", features = ["x86-v4"] }
# The process's resident memory for the memory limit (task 5.5); the version and
# features polars already builds (`polars-utils`).
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
# Filters, selections and computed columns (task 5.8) evaluate resolved expressions; the
# per-cell QC metrics they compute (task 6.1) moved here from kyto-algo.
kyto-core = { path = "../kyto-core" }
# Expressions run on the cell and gene tables through Polars; same version as kyto-core,
# the features kyto-algo used for the QC gene sets.
polars = { version = "0.55.2", default-features = false, features = ["lazy", "strings", "dtype-categorical"] }
# Sinks (task 5.9): an `.h5ad` sink writes a temporary store next to the target first.
tempfile = "3.27.0"
# The small dense steps of the streamed PCA (task 6.5): QR, SVD and the symmetric
# eigendecomposition of its Krylov basis, on one thread (`Par::Seq`, R11).
faer = { version = "0.24.4", default-features = false, features = ["std", "linalg"] }
# Approximate nearest neighbours (task 6.6): the HNSW index, named by the plan.
hnsw_rs = "0.3.5"

[dev-dependencies]
# Counts allocations for the 5.1 Done-when check (a global allocator, no unsafe here).
stats_alloc = "0.1.10"
# Peak heap bytes for the 5.5 memory-limit check, against the estimate (as kyto-plan's 4.6 check).
peak_alloc = "0.3.0"
proptest = "1.11.0"
# The 4.4 reference evaluator's dataset schema (`kyto-plan/tests/it/support.rs`, task 5.8).
serde_json = "1.0.154"
# Kernel benches (task 5.3): `cargo bench -p kyto-exec --bench kernels`.
criterion = { version = "0.8.2", default-features = false }

[[bench]]
name = "kernels"
harness = false
