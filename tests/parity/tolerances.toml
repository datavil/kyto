# The parity tolerance table (task 10.2): every tolerance a test applies when it
# compares kyto with scanpy or anndata lives here, not in the tests (AGENTS.md,
# "Parity with scanpy"). Rust tests read it through `tests/parity/tolerances.rs`
# (`tolerance("pca.variance")`), Python tests through `tests/parity`
# (`from parity import tolerance`). `tests/test_parity_suite.py` checks the table.
#
# One section per tolerance, named `<algorithm>.<what>`, with:
#   value  : the number the test compares against (a TOML float on one line).
#   kind   : "relative" (|kyto - ref| <= value * |ref|), "absolute" (|kyto - ref| <=
#            value), "floor" (an agreement measure must be at least value),
#            "margin" (kyto may fall at most value below the reference's range), or
#            "ulp" (at most value float32 units in the last place apart).
#   task   : the plan task whose Done-when the tolerance checks.
#   tests  : the test files that apply it (each names the tolerance).
#   reason : one line: why this value, and what was measured.
#
# Tightening a value is always fine. Loosening one needs a reason here and a row in
# deviations.md if kyto now differs from the reference; never loosen to pass.
# Comparisons the tests make bit for bit (HVG sets, neighbour rows, normalize_total,
# connectivities on scanpy's graph, the anndata import) need no entry.

[qc.values]
value = 1e-6
kind = "relative"
task = "6.1"
tests = [
    "crates/kyto-algo/tests/it/qc_parity.rs",
    "crates/kyto-exec/tests/it/filter_qc_parity.rs",
    "crates/kyto-exec/tests/it/gene_qc_parity.rs",
    "tests/test_qc.py",
]
reason = "6.1's Done-when; scanpy sums float32 values in float32, kyto in float64 (deviations.md 'QC metric dtypes')."

[normalize_log1p.values]
value = 1e-6
kind = "relative"
task = "6.2"
tests = [
    "crates/kyto-exec/tests/it/normalize_log1p_parity.rs",
    "crates/kyto-exec/tests/it/filter_qc_parity.rs",
]
reason = "6.2's Done-when; normalize_total is bit for bit, numpy's float32 log1p is up to 1 ulp off kyto's correctly rounded one."

