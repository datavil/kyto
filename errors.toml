# kyto error registry (task 8.1, R10). The single source of every kyto error.
#
# `scripts/error_registry.py` generates the Rust enum
# (crates/kyto-error/src/registry.rs) and the Python classes (python/kyto/errors.py
# and errors.pyi) from this file. Edit here, then run
#     uv run python scripts/error_registry.py
# CI fails if the generated files drift from this file, or if any Rust or Python
# source raises an error that is not registered here.
#
# Codes are stable: never reuse or renumber one. Ranges:
#   KY-E1xx storage    KY-E2xx names, axes and expressions (plan build)
#   KY-E3xx lineage    KY-E4xx memory    KY-E5xx devices
#   KY-E6xx not implemented yet (a documented method whose task is not done)
#
# Templates: `{field}` inserts a field. Field types are `str`, `int` (a non-negative
# integer, u64 in Rust), `list[str]` (rendered as 'a', 'b', 'c') and `suggestions`
# (close matches for an unknown name, task 8.2: a list of strings rendered as
# ; did you mean 'a', 'b', 'c'? or as nothing when empty; place it right after the
# sentence naming the unknown name, with no space before it). Write the quotes around
# a `str` field in the template yourself ('{name}'); list fields bring their own. No
# other braces, no double quotes, no backslashes.
#
# Each error says what was wrong, where, what was accepted and how to fix it
# (AGENTS.md, "Errors are first-class"). `example` values feed the round-trip tests.

docs_base = "https://github.com/datavil/kyto/blob/main/docs/errors.md"

# Python classes: one per error family. Each subclasses KytoError and the builtin
# named in `base`.

[classes.DuplicateIdError]
base = "ValueError"
doc = "Cell or gene IDs that must be unique are not."

[classes.ResolutionError]
base = "ValueError"
doc = "A name or symbol does not resolve to exactly one feature."

[classes.AxisError]
base = "TypeError"
doc = "An expression mixes the cells and genes axes (R5)."

[classes.RemovedFeatureError]
base = "ValueError"
doc = "A feature removed earlier in the plan is read again (R9)."

[classes.StaleColumnError]
base = "ValueError"
doc = "A derived column is read after its inputs changed upstream."

[classes.LineageError]
base = "ValueError"
doc = "A column is asked to be recomputed but records no lineage to recompute it from."

[classes.MemoryLimitError]
base = "MemoryError"
doc = "A plan cannot run within its memory limit."

[classes.DeviceError]
base = "RuntimeError"
doc = "The requested device cannot run part of the plan."

[classes.StoreInputError]
base = "ValueError"
doc = "Data, names, parameters or selections given to a store writer or reader break the store format (docs/format.md)."

[classes.CorruptStoreError]
base = "ValueError"
doc = "A store on disk breaks the store format (docs/format.md)."

[classes.FormatVersionError]
base = "ValueError"
doc = "A store has a format_version this kyto does not read (format.md section 11)."

[classes.StoreIOError]
base = "RuntimeError"
doc = "The file system or the Zarr layer failed while reading or writing a store."

[classes.MissingMemberError]
base = "LookupError"
doc = "A layer, embedding, graph or modality is not in the store."

[classes.LayerDtypeError]
base = "TypeError"
doc = "A layer is read with a value dtype other than the one it stores."

[classes.ExpressionError]
base = "TypeError"
doc = "An expression is given an operand, or used in a context, that it does not support."

[classes.InputFileError]
base = "ValueError"
doc = "An input file given to convert has a format, encoding or value kyto cannot import."

[classes.PlanError]
base = "ValueError"
doc = "A plan method is given an argument outside what it accepts, or cannot extend this plan."

[classes.RunCancelledError]
base = "RuntimeError"
doc = "A run was cancelled before it finished (Ctrl-C, or its progress callback raised)."

[classes.NotImplementedYetError]
base = "NotImplementedError"
doc = "A documented method is not implemented yet in this kyto version; its task in the implementation plan adds it."

[[errors]]
code = "KY-E101"
variant = "DuplicateIds"
class = "DuplicateIdError"
summary = "IDs written to a store are not unique."
message = "the {axis} table has {n_duplicated} IDs that occur more than once, first: {ids}"
hint = "IDs on the {axis} axis must be unique (exact byte comparison); drop or rename the duplicates before writing, or import with on_duplicate_ids='suffix' to make them unique"
fields = [
    { name = "axis", type = "str", doc = "The axis, `cells` or `genes`.", example = "genes" },
    { name = "n_duplicated", type = "int", doc = "How many distinct IDs occur more than once.", example = 12 },
    { name = "ids", type = "list[str]", doc = "The first duplicated IDs, in the order they repeat (at most 5).", example = ["ENSG01", "ENSG02"] },
]

[[errors]]
code = "KY-E102"
variant = "InvalidMemberName"
class = "StoreInputError"
summary = "A layer, embedding or graph name breaks the naming rules of format.md section 2.1."
message = "invalid {kind} name '{name}': {rule}"
hint = "use 1 to 64 characters from A-Z a-z 0-9 _ . - that do not start with . or __, do not end with . and are not a Windows device name such as CON"
fields = [
    { name = "kind", type = "str", doc = "The member kind: `layer`, `embedding`, `graph` or `modality`.", example = "layer" },
    { name = "name", type = "str", doc = "The name as given.", example = "log1p/counts" },
    { name = "rule", type = "str", doc = "The rule it breaks.", example = "character '/' is not allowed" },
]

[[errors]]
code = "KY-E103"
variant = "MemberExists"
class = "StoreInputError"
summary = "A member with the same name, compared case-insensitively, is already in the store."
message = "{kind} '{name}' already exists in the store as '{existing}'"
hint = "choose another name; names are compared case-insensitively because macOS and Windows file systems are"
fields = [
    { name = "kind", type = "str", doc = "The member kind: `layer`, `embedding`, `graph` or `modality`.", example = "layer" },
    { name = "name", type = "str", doc = "The name as given.", example = "Counts" },
    { name = "existing", type = "str", doc = "The name already in the store.", example = "counts" },
]

[[errors]]
code = "KY-E104"
variant = "InvalidParameter"
class = "StoreInputError"
summary = "A store writer parameter (tile or chunk size, compression level) is out of range."
message = "invalid {parameter} = {value}"
hint = "{parameter} must be {accepted}"
fields = [
    { name = "parameter", type = "str", doc = "The parameter name.", example = "nnz_shard_size" },
    { name = "value", type = "str", doc = "The value given.", example = "1000" },
    { name = "accepted", type = "str", doc = "What the parameter accepts.", example = "a positive multiple of nnz_chunk_size (256)" },
]

[[errors]]
code = "KY-E105"
variant = "LimitExceeded"
class = "StoreInputError"
summary = "A size is above a limit of the store format (format.md section 4.5)."
message = "{quantity} is {value}, above the format limit of {limit}"
hint = "{advice} to stay within the limits of format.md section 4.5"
fields = [
    { name = "quantity", type = "str", doc = "What is too large.", example = "cell_block_size * gene_block_size" },
    { name = "value", type = "int", doc = "Its value.", example = 8589934592 },
    { name = "limit", type = "int", doc = "The largest value allowed.", example = 4294967295 },
    { name = "advice", type = "str", doc = "How to get under the limit.", example = "use smaller cell_block_size or gene_block_size" },
]

[[errors]]
code = "KY-E106"
variant = "InvalidSparseMatrix"
class = "StoreInputError"
summary = "A sparse matrix given to a store writer is not valid CSR of the stated shape."
message = "invalid sparse matrix for layer '{layer}': {problem}"
hint = "pass CSR with indptr of length n_cells + 1 starting at 0 and non-decreasing, and sorted, unique gene indices below n_genes in each row (format.md section 4.3)"
fields = [
    { name = "layer", type = "str", doc = "The layer being written.", example = "counts" },
    { name = "problem", type = "str", doc = "What is wrong and where.", example = "row 4: gene index 7 follows 9; indices must be strictly increasing" },
]

[[errors]]
code = "KY-E107"
variant = "CorruptLayer"
class = "CorruptStoreError"
summary = "A stored layer breaks the tiled sparse format (format.md section 4)."
message = "layer '{layer}' is corrupt: {problem}"
hint = "the store breaks docs/format.md section 4; rewrite the layer with kyto, or report a bug if kyto wrote it"
fields = [
    { name = "layer", type = "str", doc = "The layer being read.", example = "counts" },
    { name = "problem", type = "str", doc = "The invariant that fails and where.", example = "tile (0, 2): indptr ends at 5 but tile_offsets gives 7 entries" },
]

[[errors]]
code = "KY-E108"
variant = "LayerDtype"
class = "LayerDtypeError"
summary = "A layer is read with a value dtype other than the one it stores."
message = "layer '{layer}' stores {stored} values, not {requested}"
hint = "read layer '{layer}' as {stored}"
fields = [
    { name = "layer", type = "str", doc = "The layer being read.", example = "counts" },
    { name = "stored", type = "str", doc = "The Zarr dtype of its data array.", example = "uint32" },
    { name = "requested", type = "str", doc = "The dtype asked for.", example = "float32" },
]

[[errors]]
code = "KY-E109"
variant = "MissingMember"
class = "MissingMemberError"
summary = "A layer, embedding, graph or modality is not in the store."
message = "no {kind} named '{name}' in the store at '{store}'{suggestions}"
hint = "check the name against the store's schema; names are case-sensitive when read"
fields = [
    { name = "kind", type = "str", doc = "The member kind: `layer`, `embedding`, `graph` or `modality`.", example = "layer" },
    { name = "name", type = "str", doc = "The name asked for.", example = "count" },
    { name = "store", type = "str", doc = "The store path.", example = "pbmc.kyto" },
    { name = "suggestions", type = "suggestions", doc = "Up to three members of that kind whose names are closest to `name` (Jaro-Winkler, task 8.2), best first; empty when none is close.", example = ["counts"] },
]

[[errors]]
code = "KY-E110"
variant = "StoreIo"
class = "StoreIOError"
summary = "The file system or the Zarr layer failed while reading or writing a store."
message = "could not {operation} '{path}': {detail}"
hint = "check that the path exists, that you may read and write it, and that the disk is not full"
fields = [
    { name = "operation", type = "str", doc = "What was being done.", example = "write array" },
    { name = "path", type = "str", doc = "The store path or node.", example = "pbmc.kyto/layers/counts/data" },
    { name = "detail", type = "str", doc = "The underlying error.", example = "No space left on device (os error 28)" },
]

[[errors]]
code = "KY-E111"
variant = "InvalidIds"
class = "StoreInputError"
summary = "The ID column of a cell or gene table holds null or empty IDs."
message = "the {axis} table has {n_invalid} {problem} IDs, first at rows {rows}"
hint = "every {axis} ID must be a non-null, non-empty string; fill or drop those rows before writing"
fields = [
    { name = "axis", type = "str", doc = "The axis, `cells` or `genes`.", example = "cells" },
    { name = "n_invalid", type = "int", doc = "How many IDs are invalid.", example = 2 },
    { name = "problem", type = "str", doc = "What is wrong with them: `null` or `empty`.", example = "null" },
    { name = "rows", type = "list[str]", doc = "The first rows (0-based) with such an ID (at most 5).", example = ["3", "17"] },
]

[[errors]]
code = "KY-E112"
variant = "InvalidTableColumn"
class = "StoreInputError"
summary = "A column of a cell or gene table breaks format.md section 5 (name, dtype or position)."
message = "column '{column}' of the {axis} table {problem}"
hint = "{accepted} (format.md section 5)"
fields = [
    { name = "axis", type = "str", doc = "The axis, `cells` or `genes`.", example = "cells" },
    { name = "column", type = "str", doc = "The column name.", example = "sample" },
    { name = "problem", type = "str", doc = "What is wrong.", example = "has dtype Categorical, which v0 stores do not allow" },
    { name = "accepted", type = "str", doc = "What would be accepted.", example = "cast it to String or to an Enum with fixed categories" },
]

[[errors]]
code = "KY-E113"
variant = "CorruptTable"
class = "CorruptStoreError"
summary = "A stored cell or gene table breaks format.md section 5."
message = "table '{path}' is corrupt: {problem}"
hint = "the store breaks docs/format.md section 5; rewrite the table with kyto, or report a bug if kyto wrote it"
fields = [
    { name = "path", type = "str", doc = "The table file.", example = "pbmc.kyto/cells.parquet" },
    { name = "problem", type = "str", doc = "The invariant that fails.", example = "the first column is 'barcode', not 'cell_id'" },
]

[[errors]]
code = "KY-E114"
variant = "InvalidSelection"
class = "StoreInputError"
summary = "A cell or gene selection given to the tile reader is out of range, unsorted or repeats a position."
message = "invalid {axis} selection: {problem}"
hint = "select {axis} by sorted, unique table positions below {n_axis}; the plan canonicalises other orders and repeats (format.md section 4.8)"
fields = [
    { name = "axis", type = "str", doc = "The axis, `cells` or `genes`.", example = "genes" },
    { name = "problem", type = "str", doc = "What is wrong and where in the selection.", example = "position 2 is gene 7, which does not follow gene 9" },
    { name = "n_axis", type = "int", doc = "The axis length of the store.", example = 2000 },
]

[[errors]]
code = "KY-E115"
variant = "UnsupportedFormatVersion"
class = "FormatVersionError"
summary = "A store has a format_version this kyto does not read (format.md section 11)."
message = "the store at '{store}' has format_version '{found}', but this kyto reads only {supported}"
hint = "open the store with the kyto version that wrote it, or rewrite it with this one"
fields = [
    { name = "store", type = "str", doc = "The store path.", example = "pbmc.kyto" },
    { name = "found", type = "str", doc = "The store's format_version.", example = "0.2" },
    { name = "supported", type = "list[str]", doc = "The format versions this kyto reads.", example = ["0.1"] },
]

[[errors]]
code = "KY-E116"
variant = "NotAStore"
class = "CorruptStoreError"
summary = "A path is not a kyto store: its root zarr.json is missing or has no format_version (format.md section 3)."
message = "'{store}' is not a kyto store: {problem}"
hint = "check the path; a kyto store has a root zarr.json with attributes.kyto.format_version, written last, so an interrupted write leaves none"
fields = [
    { name = "store", type = "str", doc = "The store path.", example = "pbmc.kyto" },
    { name = "problem", type = "str", doc = "What is missing or wrong.", example = "no root zarr.json" },
]

[[errors]]
code = "KY-E117"
variant = "InvalidCellBlock"
class = "StoreInputError"
summary = "A CellBlock is not valid CSR, or does not fit the store or layer it is written to (format.md sections 4.8 and 10.2)."
message = "invalid CellBlock ({context}): {problem}"
hint = "build CellBlocks with indptr starting at 0, non-decreasing and ending at nnz, and sorted, unique gene positions below n_genes in each row; a store writer also needs one block per layer, in layer order, over all genes of the store, with the layer's dtype and the same rows in every layer"
fields = [
    { name = "context", type = "str", doc = "Where the block was given: the constructor, or the writer layer.", example = "StoreWriter.push, layer 'counts'" },
    { name = "problem", type = "str", doc = "What is wrong and where (row, position).", example = "the block has 2000 genes but the store has 32738" },
]

[[errors]]
code = "KY-E118"
variant = "StoreExists"
class = "StoreInputError"
summary = "A store writer's target path already exists (format.md section 10.1)."
message = "cannot write a store to '{path}': {problem}"
hint = "choose another path, remove the existing one first, or write with overwrite=True to replace an existing kyto store (it is replaced only after the new store is complete)"
fields = [
    { name = "path", type = "str", doc = "The target path.", example = "pbmc.kyto" },
    { name = "problem", type = "str", doc = "What is there.", example = "a kyto store already exists there" },
]

[[errors]]
code = "KY-E119"
variant = "TableLength"
class = "StoreInputError"
summary = "A cell or gene table given to a store writer does not have one row per matrix row or column (format.md section 5.1)."
message = "the {axis} table has {n_rows} rows, but the matrix has {n_axis} {axis}"
hint = "pass one {axis} table row per matrix {axis} entry, in matrix order"
fields = [
    { name = "axis", type = "str", doc = "The axis, `cells` or `genes`.", example = "cells" },
    { name = "n_rows", type = "int", doc = "Rows in the table.", example = 2699 },
    { name = "n_axis", type = "int", doc = "Length of the matrix axis.", example = 2700 },
]

[[errors]]
code = "KY-E120"
variant = "UnsupportedInput"
class = "InputFileError"
summary = "An input file given to convert has a format or an encoding kyto does not import."
message = "cannot import '{path}': {problem}"
hint = "{accepted} (see the kyto.convert docstring for the inputs it reads)"
fields = [
    { name = "path", type = "str", doc = "The input path, or the member inside it.", example = "pbmc.h5ad:/X" },
    { name = "problem", type = "str", doc = "What is not supported.", example = "encoding-type 'awkward-array' is not supported" },
    { name = "accepted", type = "str", doc = "What would be imported, and how to get there.", example = "store X as an array, csr_matrix or csc_matrix (anndata >= 0.8 writes these)" },
]

[[errors]]
code = "KY-E121"
variant = "InvalidInput"
class = "InputFileError"
summary = "An input file given to convert holds a value or a structure that breaks its own format or cannot be stored."
message = "invalid input '{path}' at {location}: {problem}"
hint = "{advice}, then convert again"
fields = [
    { name = "path", type = "str", doc = "The input path, or the member inside it.", example = "pbmc.h5ad:/X" },
    { name = "location", type = "str", doc = "Where in the input: row, column, line or entry.", example = "cell 4, gene 17" },
    { name = "problem", type = "str", doc = "What is wrong.", example = "integer value -3 is negative" },
    { name = "advice", type = "str", doc = "How to fix it.", example = "integer matrices become uint32 layers; cast X to float32 in anndata before converting to keep negative values" },
]

[[errors]]
code = "KY-E122"
variant = "CorruptSchema"
class = "CorruptStoreError"
summary = "A store's schema.json is missing, is not JSON, or breaks format.md section 8."
message = "schema.json of the store at '{store}' is invalid: {problem}"
hint = "the store breaks docs/format.md section 8; write the store again with kyto, or report a bug if kyto wrote it"
fields = [
    { name = "store", type = "str", doc = "The store path.", example = "pbmc.kyto" },
    { name = "problem", type = "str", doc = "What is wrong, with the line and column of the key.", example = "it does not match the format (unknown variant `int64`, expected `float32` or `uint32` at line 7 column 40)" },
]

[[errors]]
code = "KY-E123"
variant = "OutputExists"
class = "StoreInputError"
summary = "An export's target path already exists (sink_h5ad, task 2.7)."
message = "cannot write '{path}': {problem}"
hint = "choose another path, remove the existing one first, or pass overwrite=True to replace an existing file (it is replaced only after the new file is complete; a directory is never replaced)"
fields = [
    { name = "path", type = "str", doc = "The target path.", example = "pbmc.h5ad" },
    { name = "problem", type = "str", doc = "What is there.", example = "a file already exists there" },
]

[[errors]]
code = "KY-E124"
variant = "UnsupportedExport"
class = "StoreInputError"
summary = "A store holds a name or value the export format cannot hold (sink_h5ad, task 2.7)."
message = "cannot export {location} to '{path}': {problem}"
hint = "{advice}, then export again"
fields = [
    { name = "location", type = "str", doc = "What cannot be exported: column, layer or value.", example = "cells column 'a/b'" },
    { name = "path", type = "str", doc = "The target path.", example = "pbmc.h5ad" },
    { name = "problem", type = "str", doc = "Why the format cannot hold it.", example = "h5ad names cannot contain '/'" },
    { name = "advice", type = "str", doc = "How to fix it.", example = "rename the column without '/'" },
]

[[errors]]
code = "KY-E125"
variant = "InvalidRemoteStore"
class = "StoreInputError"
summary = "A remote store URL or one of its storage options cannot be used to open an object store (task 2.8)."
message = "cannot open remote store '{url}': {problem}"
hint = "{advice}, then open the store again"
fields = [
    { name = "url", type = "str", doc = "The store URL, with any password removed.", example = "s3://bucket/pbmc.kyto" },
    { name = "problem", type = "str", doc = "What is wrong with the URL or the options.", example = "unknown storage option 'aws_acess_key_id'" },
    { name = "advice", type = "str", doc = "How to fix it.", example = "use an option key object_store accepts for s3, such as aws_access_key_id, aws_secret_access_key, aws_region, aws_endpoint or allow_http" },
]

[[errors]]
code = "KY-E126"
variant = "CorruptMember"
class = "CorruptStoreError"
summary = "A stored embedding or graph breaks the store format (format.md sections 6 and 7), or disagrees with schema.json."
message = "{kind} '{name}' is corrupt: {problem}"
hint = "the store breaks docs/format.md sections 6 and 7; write the {kind} again with kyto, or report a bug if kyto wrote it"
fields = [
    { name = "kind", type = "str", doc = "`embedding` or `graph`.", example = "graph" },
    { name = "name", type = "str", doc = "The member being read.", example = "connectivities" },
    { name = "problem", type = "str", doc = "The invariant that fails and where.", example = "row 4: index 7 follows 9; indices must be strictly increasing" },
]

[[errors]]
code = "KY-E201"
variant = "AmbiguousName"
class = "ResolutionError"
summary = "A feature name matches more than one feature."
message = "ambiguous name '{name}': it matches {candidates}"
hint = "pass one full name instead, one of {candidates}; where two share a full name, use cell_column(...), gene_expression(..., layer=...) or cell_embedding(...)"
fields = [
    { name = "name", type = "str", doc = "The name as written to feature(...).", example = "CD3E" },
    { name = "candidates", type = "list[str]", doc = "The full names it matches (docs/feature_names.md), each followed by its kind when two are written alike.", example = ["meta:CD3E", "log1p:CD3E"] },
]

[[errors]]
code = "KY-E202"
variant = "MixedAxes"
class = "AxisError"
summary = "A cell expression and a gene expression are combined."
message = "'{operation}' mixes a cell expression ({cell_expression}) with a gene expression ({gene_expression})"
hint = "combine expressions of one axis only: cell_column(...) with cell_column(...), gene_column(...) with gene_column(...)"
fields = [
    { name = "operation", type = "str", doc = "The operator or method that combined them.", example = "&" },
    { name = "cell_expression", type = "str", doc = "The cell expression.", example = "cell_column('n_genes') > 200" },
    { name = "gene_expression", type = "str", doc = "The gene expression.", example = "gene_column('highly_variable')" },
]

[[errors]]
code = "KY-E203"
variant = "RemovedGene"
class = "RemovedFeatureError"
summary = "A gene removed by a filter is read later in the plan."
message = "gene '{gene}' was removed by '{removed_by}' earlier in the plan"
hint = "read '{gene}' before '{removed_by}', or change the filter to keep it"
fields = [
    { name = "gene", type = "str", doc = "The gene that was read.", example = "MALAT1" },
    { name = "removed_by", type = "str", doc = "The plan node that removed it.", example = "filter_genes" },
]

[[errors]]
code = "KY-E204"
variant = "AmbiguousSymbol"
class = "ResolutionError"
summary = "A gene symbol matches more than one gene ID."
message = "symbol '{symbol}' matches more than one gene: {gene_ids}"
hint = "select the gene by ID with by='id', one of {gene_ids}"
fields = [
    { name = "symbol", type = "str", doc = "The symbol as written.", example = "TBCE" },
    { name = "gene_ids", type = "list[str]", doc = "The gene IDs that carry this symbol.", example = ["ENSG00000284770", "ENSG00000285053"] },
]

[[errors]]
code = "KY-E205"
variant = "ExpressionOperand"
class = "ExpressionError"
summary = "An expression operation is given an operand of a dtype or type it does not accept."
message = "'{operation}' needs {accepted}, got {got}: {operand}"
hint = "pass {accepted} to '{operation}', or use an operation that accepts {got}"
fields = [
    { name = "operation", type = "str", doc = "The operator or method, such as `+`, `&` or `str.starts_with`.", example = "str.starts_with" },
    { name = "accepted", type = "str", doc = "What the operation accepts.", example = "a string expression" },
    { name = "got", type = "str", doc = "What it was given.", example = "a numeric expression" },
    { name = "operand", type = "str", doc = "The operand, written as code.", example = "cell_column('n_genes') + 1" },
]

[[errors]]
code = "KY-E206"
variant = "ExpressionTruthValue"
class = "ExpressionError"
summary = "An expression is used where Python needs True or False."
message = "the truth value of an expression is ambiguous: {expression}"
hint = "combine conditions with &, | and ~ instead of and, or and not, and write a < b < c as (a < b) & (b < c); an expression is evaluated only when the plan runs"
fields = [
    { name = "expression", type = "str", doc = "The expression, written as code.", example = "cell_column('n_genes') > 200" },
]

[[errors]]
code = "KY-E207"
variant = "ExpressionDepth"
class = "ExpressionError"
summary = "An expression tree is deeper than kyto builds."
message = "'{operation}' would make an expression {depth} levels deep; the limit is {limit}"
hint = "build long chains as a balanced tree, combining pairs and then pairs of pairs, instead of adding one term at a time"
fields = [
    { name = "operation", type = "str", doc = "The operator or method that would exceed the limit.", example = "+" },
    { name = "depth", type = "int", doc = "The depth the result would have.", example = 1001 },
    { name = "limit", type = "int", doc = "The deepest expression kyto builds.", example = 1000 },
]

[[errors]]
code = "KY-E208"
variant = "FeatureNameSyntax"
class = "ResolutionError"
summary = "A feature name cannot name any feature."
message = "invalid feature name '{name}' in feature(...): {problem}"
hint = "write a short name such as 'CD3E' or 'cluster', or a full name '<prefix>:<name>' such as 'log1p:CD3E' or 'meta:cluster'"
fields = [
    { name = "name", type = "str", doc = "The name as written.", example = "log1p:" },
    { name = "problem", type = "str", doc = "What is wrong with it.", example = "nothing follows 'log1p:'" },
]

[[errors]]
code = "KY-E209"
variant = "EmbeddingComponent"
class = "ExpressionError"
summary = "An embedding component is not a non-negative int."
message = "'{constructor}' needs a non-negative int component (0-based), got {got}: {component}"
hint = "pass the component as an int from 0, such as {constructor}('{name}', 0) for the first one"
fields = [
    { name = "constructor", type = "str", doc = "The constructor called.", example = "cell_embedding" },
    { name = "name", type = "str", doc = "The embedding name passed.", example = "pca" },
    { name = "got", type = "str", doc = "What the component was.", example = "a negative int" },
    { name = "component", type = "str", doc = "The component, written as code.", example = "-1" },
]

[[errors]]
code = "KY-E210"
variant = "UnknownName"
class = "ResolutionError"
summary = "A name does not match any column, gene, cell, embedding component or feature of the plan."
message = "unknown {kind} '{name}' in {expression}: {problem}{suggestions}"
hint = "names are matched exactly, case included; check '{name}' against the store's schema, and read a gene by its symbol with gene_expression(symbol, by='symbol')"
fields = [
    { name = "kind", type = "str", doc = "What the name should name: `cell column`, `gene column`, `gene`, `gene symbol`, `cell`, `cell embedding`, `gene embedding`, `embedding component` or `feature`.", example = "feature" },
    { name = "name", type = "str", doc = "The name as written.", example = "CD3" },
    { name = "expression", type = "str", doc = "The expression it was written in, as code.", example = "feature('CD3')" },
    { name = "problem", type = "str", doc = "Why nothing matches.", example = "it is not a column of the cell table or a gene ID" },
    { name = "suggestions", type = "suggestions", doc = "Up to three names of the same kind closest to `name` (Jaro-Winkler, task 8.2), best first, written as `name` was; a gene symbol offered for a gene ID or a feature name reads `CD3E (gene symbol)`. Empty when none is close.", example = ["CD3E (gene symbol)", "CD3D (gene symbol)", "CD3G (gene symbol)"] },
]

[[errors]]
code = "KY-E211"
variant = "NoDefaultLayer"
class = "ResolutionError"
summary = "A gene or cell is read from the default layer, but the plan has none."
message = "{expression} reads the default layer, but the plan has none"
hint = "set one with .with_default_layer(...) before resolving, or name the layer; the store has {layers}"
fields = [
    { name = "expression", type = "str", doc = "The expression that reads it, as code.", example = "feature('CD3E')" },
    { name = "layers", type = "list[str]", doc = "The store's layers.", example = ["counts", "log1p"] },
]

[[errors]]
code = "KY-E212"
variant = "NullComparison"
class = "ExpressionError"
summary = "An expression is compared with None, which is not a test for missing values."
message = "'{operation}' with None does not test for missing values: {expression}"
hint = "write {suggestion} instead; missing values are null (R9)"
fields = [
    { name = "operation", type = "str", doc = "The comparison, `==` or `!=`.", example = "==" },
    { name = "expression", type = "str", doc = "The comparison as written, as code.", example = "cell_column('cell_type') == None" },
    { name = "suggestion", type = "str", doc = "The null test to write instead, as code.", example = "cell_column('cell_type').is_null()" },
]

[[errors]]
code = "KY-E213"
variant = "RecomputeOperand"
class = "ExpressionError"
summary = "`.recompute()` is called on an expression that is not a plain column read."
message = "'.recompute()' needs a plain column read such as {example}, got {expression}"
hint = "call .recompute() on the column read itself, then build on the result: write {example} first"
fields = [
    { name = "expression", type = "str", doc = "The expression it was called on, as code.", example = "cell_column('n_genes') + 1" },
    { name = "example", type = "str", doc = "A plain column read of the same axis, as code.", example = "cell_column('n_genes').recompute()" },
]

[[errors]]
code = "KY-E214"
variant = "InvalidChoice"
class = "ResolutionError"
summary = "An argument that picks how a name is looked up is given a value it does not accept."
message = "{function}(..., {parameter}={value}) is not accepted"
hint = "{parameter} takes one of {accepted}"
fields = [
    { name = "function", type = "str", doc = "The function or method called.", example = "gene_expression" },
    { name = "parameter", type = "str", doc = "The argument name.", example = "by" },
    { name = "value", type = "str", doc = "The value given, as code.", example = "'name'" },
    { name = "accepted", type = "list[str]", doc = "The values it accepts.", example = ["id", "symbol"] },
]

[[errors]]
code = "KY-E215"
variant = "InvalidArgument"
class = "PlanError"
summary = "A plan method is given an argument value outside what it accepts."
message = "{function}(..., {parameter}={value}) is invalid: {problem}"
hint = "pass {accepted} as {parameter}"
fields = [
    { name = "function", type = "str", doc = "The plan method called.", example = "pca" },
    { name = "parameter", type = "str", doc = "The argument name.", example = "n_components" },
    { name = "value", type = "str", doc = "The value given, as code.", example = "0" },
    { name = "problem", type = "str", doc = "What is wrong with it.", example = "a PCA needs at least one component" },
    { name = "accepted", type = "str", doc = "What the argument accepts.", example = "an int from 1 to 2000" },
]

[[errors]]
code = "KY-E216"
variant = "PlanEnded"
class = "PlanError"
summary = "A plan that ends in a sink is extended with another step."
message = "'{method}' cannot follow '{sink}': a plan ends at its sink"
hint = "add '{method}' before '{sink}', or build a new plan from the store that '{sink}' writes"
fields = [
    { name = "method", type = "str", doc = "The plan method called.", example = "log1p" },
    { name = "sink", type = "str", doc = "The sink that ends the plan.", example = "sink_zarr" },
]

[[errors]]
code = "KY-E217"
variant = "InvalidPlanJson"
class = "PlanError"
summary = "Text given to from_json is not a plan JSON, or breaks its format."
message = "the plan JSON is invalid at {location}: {problem}"
hint = "pass the text Atlas.to_json() wrote, unchanged; to change a plan, build it with plan methods and write it again"
fields = [
    { name = "location", type = "str", doc = "Where: the line and column, or the node and expression entry.", example = "node 2 (filter_cells), predicate entry 3" },
    { name = "problem", type = "str", doc = "What is wrong there.", example = "entry 3 reads entry 5, which is not written before it" },
]

[[errors]]
code = "KY-E218"
variant = "PlanJsonVersion"
class = "PlanError"
summary = "A plan JSON has a version this kyto does not read."
message = "the plan JSON has version {found}, but this kyto reads only version {supported}"
hint = "load it with the kyto version that wrote it, or build the plan again with this one and write it with Atlas.to_json()"
fields = [
    { name = "found", type = "int", doc = "The version in the text.", example = 2 },
    { name = "supported", type = "int", doc = "The version this kyto reads and writes.", example = 1 },
]

[[errors]]
code = "KY-E301"
variant = "StaleColumn"
class = "StaleColumnError"
summary = "A derived column is read after an upstream step changed its inputs."
message = "column '{column}' was computed before '{changed_by}' changed its inputs"
hint = "call .recompute() on '{column}' after '{changed_by}', or read it before that step"
fields = [
    { name = "column", type = "str", doc = "The derived column.", example = "n_genes" },
    { name = "changed_by", type = "str", doc = "The plan node that changed its inputs.", example = "filter_genes" },
]

[[errors]]
code = "KY-E302"
variant = "NoLineage"
class = "LineageError"
summary = "A column without lineage is asked to be recomputed."
message = "{expression} asks to recompute {kind} '{column}', but the store records no lineage for it"
hint = "only derived columns written by kyto record their lineage (schema.json); read '{column}' as stored, or compute it again from the matrix"
fields = [
    { name = "expression", type = "str", doc = "The expression, as code.", example = "cell_column('n_genes').recompute()" },
    { name = "kind", type = "str", doc = "`cell column` or `gene column`.", example = "cell column" },
    { name = "column", type = "str", doc = "The column.", example = "n_genes" },
]

[[errors]]
code = "KY-E303"
variant = "NoRecipe"
class = "LineageError"
summary = "A column with lineage is asked to be recomputed, but the store does not hold the plan that computed it."
message = "{expression} asks to recompute {kind} '{column}', but {problem}"
hint = "only stores written by a kyto sink hold the plan that computed a column (provenance.json); read '{column}' as stored, or compute it again from the matrix"
fields = [
    { name = "expression", type = "str", doc = "The expression, as code.", example = "cell_column('n_genes').recompute()" },
    { name = "kind", type = "str", doc = "`cell column` or `gene column`.", example = "cell column" },
    { name = "column", type = "str", doc = "The column.", example = "n_genes" },
    { name = "problem", type = "str", doc = "Why the recipe is missing.", example = "provenance.json records no plan (lineage names node 3)" },
]

[[errors]]
code = "KY-E401"
variant = "MemoryLimit"
class = "MemoryLimitError"
summary = "A plan needs more memory than its limit, even with the smallest blocks."
message = "the plan needs at least {required_bytes} bytes but memory_limit is {limit_bytes} bytes"
hint = "raise memory_limit to at least {required_bytes} bytes, or select fewer cells or genes before this step"
fields = [
    { name = "required_bytes", type = "int", doc = "The smallest peak memory the plan can run in, in bytes.", example = 6000000000 },
    { name = "limit_bytes", type = "int", doc = "The memory limit given, in bytes.", example = 4000000000 },
]

[[errors]]
code = "KY-E501"
variant = "MissingKernel"
class = "DeviceError"
summary = "The requested device has no kernel for an operation."
message = "no {device} kernel for '{operation}'"
hint = "pass device='auto' to fall back to the CPU for this step, or device='cpu'"
fields = [
    { name = "operation", type = "str", doc = "The operation without a kernel.", example = "leiden" },
    { name = "device", type = "str", doc = "The device requested.", example = "cuda" },
]

[[errors]]
code = "KY-E502"
variant = "ThreadStart"
class = "DeviceError"
summary = "The CPU executor cannot start the threads it was asked for."
message = "could not start {threads} executor threads: {problem}"
hint = "pass fewer threads, or raise the process's limit on threads"
fields = [
    { name = "threads", type = "int", doc = "The number of threads asked for.", example = 64 },
    { name = "problem", type = "str", doc = "What the operating system said.", example = "Resource temporarily unavailable (os error 35)" },
]

[[errors]]
code = "KY-E503"
variant = "Cancelled"
class = "RunCancelledError"
summary = "A run was cancelled before it finished."
message = "the run was cancelled after {done} of {total} cell rows were streamed"
hint = "run the plan again to compute it; a cancelled run returns and writes nothing"
fields = [
    { name = "done", type = "int", doc = "Cell rows streamed before the cancel, summed over the run's passes.", example = 4096 },
    { name = "total", type = "int", doc = "Cell rows the whole run streams, summed over its passes.", example = 16384 },
]

[[errors]]
code = "KY-E601"
variant = "NotImplementedYet"
class = "NotImplementedYetError"
summary = "A documented method is called before the task that implements it is done."
message = "'{method}' is not implemented yet: it arrives with task {task} of the implementation plan"
hint = "inspect the data without reading it through names(), schema() and estimate() until then"
fields = [
    { name = "method", type = "str", doc = "The method called, as Class.method.", example = "Matrix.to_scipy" },
    { name = "task", type = "str", doc = "The task of the implementation plan that implements it.", example = "7.5" },
]
